name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: debug
            sanitize: 'ON'
          - os: ubuntu-24.04
            preset: minimal
            sanitize: 'OFF'
          - os: macos-15
            preset: debug
            sanitize: 'ON'
          # Windows is otherwise only built by the release workflow, so MSVC-only
          # compile errors reached tagged releases before anyone saw them.
          - os: windows-2025
            preset: default
            sanitize: 'OFF'
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install platform build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake bison flex libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev ninja-build pkg-config wayland-protocols
      - name: Install platform build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool ninja pkg-config
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-scope: ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DIMSHARK_SANITIZE=${{ matrix.sanitize }} -DIMSHARK_WERROR=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --output-on-failure

  linux-docker:
    name: Linux / Docker + software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux verification image
        run: docker build --target verify -t imshark-linux-verify .
      - name: Test and launch desktop application without network access
        run: |
          mkdir -p artifacts/linux
          docker run --rm --init --network none -v "$PWD/artifacts/linux:/artifacts" -e SMOKE_ARTIFACT_DIR=/artifacts imshark-linux-verify
      - name: Install and launch the DEB in a clean Ubuntu image
        run: |
          docker build --target package-verify -t imshark-linux-package .
          mkdir -p artifacts/linux-package
          docker run --rm --init --network none -v "$PWD/artifacts/linux-package:/artifacts" -e SMOKE_ARTIFACT_DIR=/artifacts imshark-linux-package
      - name: Upload Linux GUI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-gui-smoke
          path: |
            artifacts/linux
            artifacts/linux-package
          if-no-files-found: ignore

  clang-tidy:
    name: Static analysis / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install platform build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake bison clang clang-tidy flex libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev ninja-build pkg-config wayland-protocols
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-scope: clang-tidy
      # Only configure: clang-tidy needs compile_commands.json and the configure-time generated headers, not objects.
      - name: Configure
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Debug -DIMSHARK_BUILD_BENCH=ON
      - name: clang-tidy
        run: |
          find core/src src tools tests -name '*.cpp' -print0 \
            | xargs -0 -P "$(nproc)" -n 4 clang-tidy -p build --quiet --warnings-as-errors='*'
