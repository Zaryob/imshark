name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libglfw3-dev libgl1-mesa-dev libgtest-dev libpcap-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw googletest pkg-config

      # ASan + UBSan catch memory errors in the parser and readers.
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIMSHARK_SANITIZE=ON

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      # Windows: MSVC with the dependencies (GLFW, GoogleTest) from the vcpkg manifest. Live capture is built as
      # the "not available" stub: the Npcap SDK is not installed on the runner.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DIMSHARK_LIVE_CAPTURE=OFF "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
