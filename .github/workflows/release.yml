# Release workflow. It runs when a tag matching v* is pushed (the workflow itself never creates a tag) and attaches
# the CPack packages of each platform to the GitHub release of that tag:
#   Linux   build/*.tar.gz, build/*.deb      (CPack TGZ;DEB)
#           ImShark-*.AppImage               (tools/make_appimage.sh with linuxdeploy, fetched by the job at run time)
#   macOS   build/*.dmg                      (CPack DragNDrop; imshark.app at the top of the image, GLFW and OpenSSL
#                                             copied in by fixup_bundle, ad-hoc signed)
#   Windows build/*.zip                      (CPack ZIP)
# Release notes and draft status: the release is created as a DRAFT so the maintainer reviews and publishes it.
# Not produced here: Developer ID signing / notarization (macOS) and Windows code signing. The workflow has not
# been run on GitHub yet, so the AppImage job in particular is untested.
name: Release

on:
  push:
    tags:
      - 'v*'

# softprops/action-gh-release creates the release and uploads assets with GITHUB_TOKEN: it needs write access.
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            assets: |
              build/*.tar.gz
              build/*.deb
              ImShark-*.AppImage
          - os: macos-latest
            assets: |
              build/*.dmg
          - os: windows-latest
            assets: |
              build/*.zip

    steps:
      - uses: actions/checkout@v4

      # The package file names carry the CMake project version, so the tag has to agree with it.
      - name: Check the tag against the project version
        shell: bash
        run: |
          project_version=$(sed -nE 's/^project\(imshark VERSION ([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project(imshark VERSION $project_version) in CMakeLists.txt" >&2
            exit 1
          fi

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libglfw3-dev libgl1-mesa-dev libgtest-dev libpcap-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw googletest pkg-config openssl@3

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIMSHARK_BUILD_TESTS=ON

      # Same configuration as ci.yml: GLFW and GoogleTest come from the vcpkg manifest; live capture and TLS
      # decryption are the "not available" stubs.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DIMSHARK_LIVE_CAPTURE=OFF -DIMSHARK_TLS_DECRYPT=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack -C Release
        working-directory: build

      # linuxdeploy is a third-party binary: it is pinned to a release tag (not "continuous") and only fetched here,
      # in CI. APPIMAGE_EXTRACT_AND_RUN lets it run on a runner without FUSE.
      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          chmod +x linuxdeploy-x86_64.AppImage
          VERSION="${GITHUB_REF_NAME#v}" LINUXDEPLOY=./linuxdeploy-x86_64.AppImage bash tools/make_appimage.sh build

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.assets }}
          fail_on_unmatched_files: true
