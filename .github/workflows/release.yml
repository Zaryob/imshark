name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            assets: |
              build/*.tar.gz
              build/*.deb
              ImShark-*.AppImage
          - os: macos-latest
            assets: build/*.dmg
          - os: windows-latest
            assets: build/*.zip
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the project version
        shell: bash
        run: |
          project_version=$(sed -nE 's/^project\(imshark VERSION ([0-9]+(\.[0-9]+)*).*/\1/p' CMakeLists.txt)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install platform build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake bison flex libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev mesa-utils ninja-build openbox pkg-config wayland-protocols wmctrl xauth xdotool xvfb
      - name: Install platform build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool ninja pkg-config
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build --preset default --parallel 2
      - name: Test
        run: ctest --preset default --parallel 1 --output-on-failure
      - name: Verify Linux desktop startup
        if: runner.os == 'Linux'
        run: bash tools/linux_smoke.sh build
      - name: Package
        run: cpack -C Release
        working-directory: build
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_PLUGIN_APPIMAGE_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy" "$LINUXDEPLOY_URL"
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-appimage" "$LINUXDEPLOY_PLUGIN_APPIMAGE_URL"
          chmod +x "$RUNNER_TEMP/linuxdeploy/linuxdeploy" "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-appimage"
          sha256sum "$RUNNER_TEMP/linuxdeploy/linuxdeploy" "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-appimage"
          export PATH="$RUNNER_TEMP/linuxdeploy:$PATH"
          VERSION="${GITHUB_REF_NAME#v}" LINUXDEPLOY=linuxdeploy bash tools/make_appimage.sh build
      - name: Upload draft release assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ matrix.assets }}
          fail_on_unmatched_files: true
